; =================================================================================================
;  RFA-Mod settings
; =================================================================================================
;  Each setting is name=value; for switches 1 = on and 0 = off. Comments go on lines of their own,
;  starting with ; (anything after a value on the same line becomes part of the value).
;  The mods are made for the Steam "publicbeta" branch of the game (Steam > the game's Properties >
;  Game Versions & Betas). On other builds they leave the game alone and say so in
;  logs\rfa_mods.log.


; -------------------------------------------------------------------------------------------------
;  Where your games are, and how the game is started
; -------------------------------------------------------------------------------------------------
[Launcher]
; Your copy of Red Faction: Armageddon: the folder with RedFactionArmageddon_DX11.exe, wherever it
; is (Steam, GOG or anywhere else). Leave it empty if you put RFA-Mod in the game folder itself.
; The editor fills it in when you choose the game folder there. For example
;   GameDir=D:\Games\Red Faction Armageddon
GameDir=
; Your copy of Red Faction: Guerrilla (Steam Edition), only for building the Guerrilla world and
; what goes with it: editor\GuerrillaBuilder.exe reads your game files from here (and fills this in
; when you choose the folder there). The game starts without it. The folder with build\pc\cache in
; it, for example
;   GuerrillaDir=D:\Games\Red Faction Guerrilla
GuerrillaDir=
; The game's program: RedFactionArmageddon_DX11.exe is its DirectX 10/11 renderer.
GameExe=RedFactionArmageddon_DX11.exe
; What the game is started with. Keep -packfiles: the official launcher passes it, and without it
; the game looks for loose dev files and crashes on its first frames.
GameArgs=-packfiles
; 1 = the launcher waits for the game to exit (keeps Steam's playtime and overlay right)
WaitForExit=1
; 1 = the game gets 4 GB of memory to work in instead of 2 (the Guerrilla world needs the room).
;     Windows only gives a 32-bit game that much when its program is marked "large address aware",
;     and the game's isn't, so the launcher keeps a copy of it in large_address\ (only that mark
;     changed; made again whenever the game updates) and starts the game from the copy, in the game
;     folder as before. Your game folder is still never changed. 0 = start the game's own program.
LargeAddressAware=1


; -------------------------------------------------------------------------------------------------
;  The loader, which starts the mods inside the game
; -------------------------------------------------------------------------------------------------
[Loader]
; 1 = if the game crashes, log where, and write logs\crash-<date>-<time>.dmp
CrashReports=1
; 1 = files in overrides\ replace the game's own (overrides\ mirrors the game folder; see
;     overrides\README.md). The FOV slider in Options > Gameplay, the Guerrilla world and its HUD
;     all need this.
Overrides=1
; 1 = log every file a level looks up (zones, archives, containers, terrain), to see which files a
;     level loads
LogLookups=0
; The key that opens and closes the in-game menus (Spawn, Limits, ...) without the console: F1-F12,
; Insert, Home, End, PageUp, PageDown, Delete, Pause, or a letter or digit. Empty = only with the
; console open (the ` key).
MenuKey=F7


; -------------------------------------------------------------------------------------------------
;  Which mods load: every mod in mods\ loads unless it is set to 0 here
; -------------------------------------------------------------------------------------------------
[Mods]
; The first six are the parts of mods\rfa_qol.dll, each with its own switch.
; Borderless fullscreen and a clean alt-tab; see [Borderless]
borderless=1
; A wider field of view; see [FOV]
fov=1
; The game keeps its video settings in video_settings.cfg (its own save always failed)
video_settings=1
; A clearer developer console that keeps all its output, and console.ini; see [Console]. The
; console opens with the ` key
console=1
; Spawn in the in-game menus: windows to spawn any vehicle, drop items, give weapons and remove
; what you spawned. Open the console, then Spawn in the bar along the bottom of the screen
spawner=1
; Limits in the in-game menus: how full the engine's fixed tables are (vehicles, animations, ...)
limits=1
; Graphics in the in-game menus: sliders and switches for the ported world's picture (the (live)
; settings under [GuerrillaWorld]), saved to this file as you change them
graphics=1
; The sky, light, clock, view distance and zone size of the world ported from Red Faction:
; Guerrilla; see [GuerrillaWorld]
guerrilla_world=1
; Red Faction: Guerrilla's HUD in that world; see [GuerrillaHud]
guerrilla_hud=1
; What Red Faction: Guerrilla's vehicles need to be driven; see [GuerrillaVehicles]
guerrilla_vehicles=1
; What Red Faction: Guerrilla's people need in that world; see [GuerrillaPeople]. It also gives the
; game room for the animations' names: once editor\GuerrillaBuilder.exe has made the people, take
; them away there (Remove) before setting this to 0, or the game stops while it starts
; ("Length of string pool exceeded"). The people's animations also need guerrilla_vehicles and
; guerrilla_gear on (they give the game room for more animations and sets)
guerrilla_people=1
; What Red Faction: Guerrilla's weapons need in that world (room for more inventory items, their
; player animations and room for those, their dropped guns, Mason's sledgehammer always in his hands'
; slot 3 and never swapped away), and the player turning to face where he walks and runs (Darius and
; Mason; aiming and attacking still face the camera); the weapons come from
; editor\GuerrillaBuilder.exe: take them away there (Remove) before setting this to 0
guerrilla_gear=1


; -------------------------------------------------------------------------------------------------
;  borderless
; -------------------------------------------------------------------------------------------------
[Borderless]
; Set the game to Windowed (Options > Display), and this turns its window into borderless
; fullscreen. In the game's own exclusive Fullscreen mode it leaves the game alone.
; 1 = borderless fullscreen. 0 = leave the game alone and only log what it does (troubleshooting)
Enabled=1
; 0 = the primary monitor. 1, 2, ... = another one (logs\rfa_mods.log lists them)
Monitor=0
; 1 = alt-tab without the game minimizing or changing mode. The game pauses as always; the mod
;     frees the cursor and mutes the keyboard and controller while you're away.
; 0 = the game's own way: it drops to a small window and minimizes when it loses focus.
IgnoreFocusLoss=1
; 1 = the Windows key works while you play (Start menu, Win+Shift+S, ...).
; 0 = the game blocks it while you play, as it normally does. Either way it works in other apps.
AllowWindowsKey=1
; 1 = render at the true resolution on displays with Windows scaling (125%, 150%, ...)
DpiAware=1


; -------------------------------------------------------------------------------------------------
;  fov
; -------------------------------------------------------------------------------------------------
[FOV]
; The vertical field of view in degrees, 30-170 (the game's own is 45). Also a slider in
; Options > Gameplay (45-170), which changes it while you play. Every camera stops at 170: at 180
; the picture turns inside out.
; On a 16:9 screen, vertical = horizontal: 45 = 73, 60 = 91, 90 = 121, 120 = 144, 150 = 163,
; 170 = 174
VerticalFov=60
; 1 = also widen vehicles and exo-suits (the community FOV fix could only do on foot)
Vehicles=1


; -------------------------------------------------------------------------------------------------
;  console: the developer console (the ` key)
; -------------------------------------------------------------------------------------------------
[Console]
; How much of the screen it covers, in percent (the game's own: 40). While the render debug panel
; (` + X) is up, it moves to the bottom of the screen, below the panel.
Height=50
; The size of its text and of the line you type, times the console font's size (1 = the game's
; own; whole numbers look sharpest). On screens taller than 1080 lines both grow to match.
TextScale=1.25
InputScale=1.5
; How dark the panel behind it is, 0-100 (the game's own is a light 50). The console's own
; console_set_bg_color <r> <g> <b> <a> still changes it while you play.
Opacity=85
; Lines it keeps for scrolling back, 256-200000 (the game kept 256)
HistoryLines=10000
; 1 = also write everything it prints to logs\console.log (started afresh each time the game starts)
LogToFile=1
; 1 = while it is shut, the last 4 lines it printed show at the top left of the screen for 3
;     seconds, as in Quake 3 (the game itself kept nothing it printed while the console was shut)
Notify=1
; 1 = a build stamp just above the line you type: the game's version, Steam build, internal name
;     and the day it was built, and RFA-Mod's version
BuildStamp=1
; 1 = also show what the game writes only for its developers: its debug output (what it loads,
;     what it couldn't) and the error reports it flashes on the screen, marked [game]
GameLog=1
; 1 = also show RFA-Mod's own log (logs\rfa_mods.log) as it's written, each line starting with
;     the mod's name
ModLog=1


; -------------------------------------------------------------------------------------------------
;  guerrilla_world: the world ported from Red Faction: Guerrilla
; -------------------------------------------------------------------------------------------------
[GuerrillaWorld]
; editor\GuerrillaBuilder.exe builds the world from your own copy of Guerrilla (GuerrillaDir under
; [Launcher]). Settings marked (live) change straight away when you save this file while the game
; runs, so you can tune them while looking at them; the rest are read when the game starts.
; The worlds all this is for, by name: rfg is the Guerrilla world (its zones are rfg_XX_YY).
; Separate several with commas.
Worlds=rfg

; --- Sky
; 1 = draw Guerrilla's sky, a dome coloured by the time of day. Armageddon draws no such sky for
;     its worlds; their sky is an effect the level places.
Sky=1
; 1 = and Guerrilla's clouds and far mountains over it. They need mods\guerrilla_world\ (the cloud
;     model and textures, made from your copy of Guerrilla along with the world); without it the
;     sky is drawn alone.
Clouds=1
; (live) How bright the sky is: its time-of-day colours times this. With Guerrilla's tone mapping
;     (ToneMapping=1) 5 is Guerrilla's own brightness.
Brightness=5

; --- Light and the time of day
; 1 = light the world as Guerrilla's day and night do: the sky's light from above and below, and
;     the sun's (by night the moon's) along its path over the day. Armageddon lights the ground
;     only with lamps its levels place, so without this the world is dark.
Light=1
; (live) How bright the sky's light is: the time of day's ambient light times this.
Ambient=1
; (live) How bright the sun and moon are: the time of day's light colour times this.
Sun=1
; (live) How strong the sun's highlights on surfaces are (their specular maps): 1 = as drawn now,
;     0 = none.
Shine=1
; (live) With ToneMapping=1, how strong the glow round bright things is: 1 = as drawn now, 0 = none.
Bloom=1
; (live) 1 = the sun and moon cast shadows, so the insides of buildings are no longer lit as if
;     outdoors. Armageddon draws no light from one direction over the whole map, so the mod moves
;     the game's own shadow lamp (the one its outdoor maps keep over the player) with the sun and draws
;     the sun's light through that lamp's shadow map. 0 = they light through everything.
SunShadows=1
; (live) 1 = Guerrilla's colour correction: its time of day's tint (bluish) over the light, sky,
;     clouds and far mountains, which turns its pink light into Guerrilla's colours. 0 = without
;     it (pink).
ColourCorrection=1
; (live) How thick Guerrilla's fog is: its haze, thicker low down and far away, district by
;     district and over the day. 1 = Guerrilla's, 0 = no fog. (Rebuild the world after updating so
;     Armageddon's own fog stays off there.)
Fog=1
; (live) 1 = Guerrilla's tone mapping: the picture's brightness adapts to what you look at as in
;     Guerrilla, and bright light rolls off into white instead of glaring. 0 = Armageddon's own (the
;     zones' fixed exposure of 3, its curve and colour grading: brighter and more orange).
ToneMapping=1
; (live) With ToneMapping=1, Guerrilla's exposure times this: 1 = Guerrilla's, higher brighter.
Exposure=1
; (live) With ToneMapping=1, Guerrilla's sun shafts: the golden glow streaming from the sky round
;     the sun past mountains and buildings. 1 = as strong as Guerrilla's, 0 = none.
SunShafts=1
; (live) Guerrilla's sun corona: the rays, glow, halo and lens flares over the picture when you
;     look toward the sun, fading as it is hidden or sets. 1 = as strong as Guerrilla's, 0 = none.
SunCorona=1
; (live) Sharpening of the picture (contrast-adaptive, as AMD's CAS), under the HUD: 0 = none,
;     100 = strongest. Detail on the ground and buildings gets crisper without halos on edges.
Sharpen=40
; (live) With ToneMapping=1, particles (fire, smoke, sparks, screens' glow) as Guerrilla draws them:
;     in a layer of their own laid over the picture after its bloom, so they keep their colours
;     instead of burning out white and glowing. 0 = drawn into the scene as Armageddon draws them.
Particles=1
; (live) Guerrilla's fog on particles: smoke, fire, sparks and explosions take on the haze's colour
;     and fade into it far off, as Guerrilla's do. 0 = not fogged (too bright far off).
ParticleFog=1
; (live) Guerrilla's dust blowing round you on the wind: thicker the stronger the wind, none indoors.
;     0 = none. Needs a world built with this version's editor\GuerrillaBuilder.exe.
Dust=1
; (live) How fast the day goes by: game seconds for each real second (48 = a day in half an hour,
; 1 = real time). 0 = leave the clock alone. Armageddon's own clock stands still; it gets its old
; speed back in every other world.
ClockSpeed=48

; --- Size and view distance
; How wide the zones are, in metres. The world is built with Guerrilla's own zones, 511 m
; (Armageddon's are 255 m; the game already knows Guerrilla's size), so Guerrilla's whole map
; fits. Only change it to match how the world was built. 0 = the game's own. When the game starts
; this also widens the game's physics world (for every world) to hold that many zones.
ZoneSize=511
; (live) How far around you whole zones stay loaded, in metres, with their far-away ground.
; Armageddon keeps only the zones next to you (its levels are walled canyons), so past them the
; ground just stops. 500 keeps the 3 x 3 zones around you loaded, as Guerrilla does. At most just
; under two zones (the game can only track so many at once; more is lowered), but 5 x 5 zones need
; far more memory than the game gives a level. 0 = the game's own.
StreamRadius=500
; (live) 1 = draw the ground in full detail as far as Guerrilla does: its textures to 250 m and the
;     ground itself to 320 m. 0 = Armageddon's own 125 m and 150 m, beyond which only a rough far
;     ground (lower than the real one) shows, so buildings and rocks there seem to float. 0 is faster.
GroundDetail=1


; -------------------------------------------------------------------------------------------------
;  guerrilla_hud: Red Faction: Guerrilla's HUD in the Guerrilla world
; -------------------------------------------------------------------------------------------------
[GuerrillaHud]
; Guerrilla's HUD in place of Armageddon's: so far its health meter and the blood that creeps in
; from the screen's corners, its reticles and ammo count, its weapon select, its minimap, and its
; world map.
; Armageddon's health ring, red screen edges and compass bar are hidden there (the top middle is
; where Guerrilla's health meter goes; Guerrilla finds the way with its minimap); its Nano Forge
; parts stay. Every other world keeps Armageddon's HUD.
; editor\GuerrillaBuilder.exe makes it from your own copy of Guerrilla (GuerrillaDir under
; [Launcher]): build it once, and again after updating RFA-Mod; until then this mod only says so in
; the log. Take it away again only with the builder (Remove): one of its files also holds the
; pictures of Armageddon's own HUD.
; The worlds it's shown in, by name: rfg is the Guerrilla world. Separate several with commas.
Worlds=rfg
; Which of Guerrilla's HUD documents to show there, separated by commas: so far rfg_ui_hud_health
; (the health meter and the blood). The builder makes each of them.
Documents=rfg_ui_hud_health
; 1 = Guerrilla's reticles and ammo count (the reticle red over an enemy, its hit markers, the
; rounds left and the rest beside it, the overheat meter) in place of Armageddon's reticle, ammo
; ring and weapon meter; 0 = Armageddon's. They need rfg_ui_hud_health above (it brings their pictures).
Reticles=1
; 1 = Guerrilla's weapon select (four plates at the bottom right, the chosen one lit with its
; name) in place of Armageddon's weapon selector, which sits where the minimap is; 0 = Armageddon's.
; It needs rfg_ui_hud_health above (it brings its pictures).
WeaponSelect=1
; 1 = Guerrilla's minimap (its map turning with the camera, the district's name, its map icons)
; and its world map (it pauses the game while open: W A S D or the arrow keys pan, the mouse wheel,
; Page Up / Page Down, Q / E or + / - zoom, X centres it on you, Esc or the key below closes it),
; and Guerrilla's safehouse upgrade shops (the use key at a safehouse's station opens its upgrade
; screen: W / S pick, the use key or Enter buys, Esc closes; it needs guerrilla_gear); 0 = none of these. They need rfg_ui_hud_health above (it brings pictures they share).
Map=1
; The key that opens and closes the world map: a letter, a digit, Tab or F1-F12; empty for none.
; Tab, as in Re-Mars-tered. In Armageddon's own levels Tab is its GPS (it turns the camera to the
; objective); the Guerrilla world has no Armageddon objectives, so there it does nothing else.
MapKey=Tab

; --- Troubleshooting (read when a HUD document loads)
; 1 = write what Guerrilla's HUD scripts find, and every health update they get, to
;     logs\rfa_mods.log
Log=0
; 1 = show Guerrilla's HUD all the time, whatever the health (the blood bright red, the meter at
;     half length), to see whether it's drawn at all. 0 = as the game goes
Test=0


; -------------------------------------------------------------------------------------------------
;  guerrilla_vehicles: driving Red Faction: Guerrilla's vehicles
; -------------------------------------------------------------------------------------------------
[GuerrillaVehicles]
; editor\GuerrillaBuilder.exe makes Guerrilla's vehicles from your own copy of Guerrilla
; (GuerrillaDir under [Launcher]); in the game, drop_car <name> in the console (drop_car Taxi).
; Armageddon's keyboard controls have no keys for driving a car, getting out of one or changing
; seats (a controller has some). These are the keys they get, by the names the console's
; controls_show_key_bindings uses (W, S, Spacebar, Shift, ...), or Mouse1..Mouse7 for a mouse
; button (Mouse3 is the middle one): Guerrilla's own. Exit also gets you out of Armageddon's own
; vehicles where the game lets you, as a controller's button does. A key you have set for one of
; them yourself is kept. Empty = leave that one as the game has it.
Accelerate=W
Brake=S
Handbrake=Spacebar
Exit=E
ChangeSeat=Mouse3
; 1 = Guerrilla's vehicles dent where they're hit, as in Guerrilla (the game's own
; vehicle_deformation_enabled, which Armageddon leaves off; its own vehicles have nothing to dent).
; 0 = they keep their shape.
Dents=1
; The worlds Guerrilla's traffic drives in (cars with drivers on Guerrilla's roads, as many as each
; zone has in Guerrilla, by day and by night), by commas; the ported world is "rfg". Empty = no traffic.
; The EDF's convoys, drive-bys and fly-bys below are in the same worlds.
TrafficWorlds=rfg
; 1 = Guerrilla's EDF convoys drive their routes (one at a time, from the end point nearest you
; that's more than 150 m away, in its hours); attack one and its escorts come after you. 0 = none.
Convoys=1
; Seconds in the world before the first convoy sets off: 600 is Guerrilla's (each end point waits
; 10 minutes after it loads). Lower it to see one sooner.
ConvoyWaitAfterLoad=600
; 1 = the EDF's ambient patrols, as in Guerrilla: scouts driving by on the roads near you (their
; gunners shoot, and they chase you once they see you), scouts driving at you to harass you, and
; Ravens flying over. 0 = none.
EdfPatrols=1
; 1 = Guerrilla's flyers fly for their NPC pilots by Guerrilla's own flight model (the EDF's fly-bys;
; a flyer you leave in the air keeps hovering while its engine runs). 0 = off: NPCs' flyers fall, as
; in Armageddon, and there are no fly-bys. Your own flying is the same either way.
NpcFlight=1


; -------------------------------------------------------------------------------------------------
;  guerrilla_people: Red Faction: Guerrilla's people
; -------------------------------------------------------------------------------------------------
[GuerrillaPeople]
; editor\GuerrillaBuilder.exe makes Guerrilla's people from your own copy of Guerrilla
; (GuerrillaDir under [Launcher]), after the world and the weapons they need. In the
; Guerrilla world, drop_human <name> in the console puts one in front of you (drop_human EDF_Trooper).
; 1 = on. 0 = off: the people's skeletons aren't loaded (a character naming one would stop the game,
;     so also take them away: Remove in editor\GuerrillaBuilder.exe)
Enabled=1
; The worlds the people and Guerrilla's sides are for (the ported world is "rfg"): there the mod
; makes room for the people in the level and gives the teams Guerrilla's dispositions (the EDF and
; the Marauders hostile to you, civilians friendly)
Worlds=rfg
; Mason's Nano Forge light: the always-on cyan glow at his left forearm that Armageddon's player has.
; 1 = on (Armageddon's). 0 = off, as Guerrilla's Mason (it also lights the reflective tape on his coat).
; Also in the F7 menu, Graphics. Shows the next time he is made: load the level again.
MasonNanoLight=1


; -------------------------------------------------------------------------------------------------
;  guerrilla_gear: Red Faction: Guerrilla's player gear
; -------------------------------------------------------------------------------------------------
[GuerrillaGear]
; Guerrilla's upgrades are bought with salvage in the F7 window Guerrilla > Upgrades, its backpacks too
; (Wear puts one on). The key that switches the worn backpack on and off: a letter, a digit or F1-F12.
; The jetpack has none: hold jump in the air and it climbs.
BackpackKey=B
